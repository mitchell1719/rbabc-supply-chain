<h1>Statement of Account</h1>

<div class="layout">

  <div class="card">

    <h3>Create SOA</h3>

    <input
      [(ngModel)]="form.districtManagerName"
      placeholder="District Manager">

    <input
      [(ngModel)]="form.branchName"
      placeholder="Branch">

    <input
      [(ngModel)]="form.reference"
      placeholder="PRS / Delivery Reference">

    <input
      type="number"
      [(ngModel)]="form.totalAmount"
      placeholder="Amount">

    <input
      [(ngModel)]="form.preparedBy"
      placeholder="Prepared By">

    <button
      [disabled]="saving"
      (click)="create()">

      {{ saving ? 'Creating…' : 'Create SOA' }}

    </button>

  </div>

  <div class="card">

    <h3>SOA Records</h3>

    <app-loading-skeleton *ngIf="loading" [rows]="4" label="Loading SOA records…"></app-loading-skeleton>

    <table *ngIf="!loading">

      <thead>
        <tr>
          <th>SOA No.</th>
          <th>District Manager</th>
          <th>Branch</th>
          <th>Reference</th>
          <th>Total</th>
          <th>Status</th>
          <th>Last Updated</th>
        </tr>
      </thead>

      <tbody>

        <tr
          *ngFor="let soa of records">

          <td>
            {{ soa.soaNumber }}
            <app-copy-button [value]="soa.soaNumber"></app-copy-button>
          </td>

          <td>
            {{ soa.districtManagerName }}
          </td>

          <td>
            {{ soa.branchName }}
          </td>

          <td>
            {{ soa.reference }}
          </td>

          <td>
            ₱{{ soa.totalAmount | number:'1.2-2' }}
          </td>

          <td>
            {{ soa.status }}
          </td>

          <td>
            <app-last-updated [date]="soa.updatedAt || soa.createdAt"></app-last-updated>
          </td>

        </tr>

      </tbody>

    </table>

    <p class="empty" *ngIf="!loading && records.length === 0">
      No statements of account yet.
    </p>

  </div>

</div>
