<h1>Settings</h1>

<div class="card">

  <h3>System Information</h3>

  <label>
    Company Name
  </label>

  <input
    [(ngModel)]="companyName">

  <label>
    Department
  </label>

  <input
    [(ngModel)]="department">

  <label>
    System Name
  </label>

  <input
    [(ngModel)]="systemName">

  <button
    (click)="save()">

    Save Settings

  </button>

</div>
