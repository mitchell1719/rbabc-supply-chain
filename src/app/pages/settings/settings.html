<h1>Settings</h1>

<app-data-state
  [loading]="loading"
  [error]="errorMessage"
  [isEmpty]="false"
  loadingMessage="Loading settings..."
  (retry)="load()">

  <div class="card">

    <h3>System Information</h3>

    <div class="message success" *ngIf="successMessage">
      {{ successMessage }}
    </div>

    <label>
      Company Name
    </label>

    <input
      [(ngModel)]="companyName">

    <label>
      Department
    </label>

    <input
      [(ngModel)]="department">

    <label>
      System Name
    </label>

    <input
      [(ngModel)]="systemName">

    <button
      [disabled]="saving"
      (click)="save()">

      {{ saving ? 'Saving...' : 'Save Settings' }}

    </button>

  </div>

</app-data-state>
