<h1>Suppliers</h1>

<div class="layout">

  <div class="card">

    <h3>New Supplier</h3>

    <input
      [(ngModel)]="supplier.name"
      placeholder="Supplier Name">

    <input
      [(ngModel)]="supplier.contactPerson"
      placeholder="Contact Person">

    <input
      [(ngModel)]="supplier.phone"
      placeholder="Phone">

    <input
      [(ngModel)]="supplier.email"
      placeholder="Email">

    <textarea
      [(ngModel)]="supplier.address"
      placeholder="Address">
    </textarea>

    <button
      [disabled]="saving"
      (click)="save()">

      {{ saving ? 'Saving…' : 'Save Supplier' }}

    </button>

  </div>

  <div class="card">

    <h3>Supplier Directory</h3>

    <app-loading-skeleton *ngIf="loading" [rows]="4" label="Loading suppliers…"></app-loading-skeleton>

    <table *ngIf="!loading">

      <thead>
        <tr>
          <th>Supplier</th>
          <th>Contact Person</th>
          <th>Phone</th>
          <th>Email</th>
          <th>Last Updated</th>
        </tr>
      </thead>

      <tbody>

        <tr
          *ngFor="let supplier of suppliers">

          <td>
            {{ supplier.name }}
          </td>

          <td>
            {{ supplier.contactPerson }}
          </td>

          <td>
            {{ supplier.phone }}
          </td>

          <td>
            {{ supplier.email }}
          </td>

          <td>
            <app-last-updated [date]="supplier.updatedAt || supplier.createdAt"></app-last-updated>
          </td>

        </tr>

      </tbody>

    </table>

    <p class="empty" *ngIf="!loading && suppliers.length === 0">
      No suppliers added yet.
    </p>

  </div>

</div>
