<div class="page-header">

  <div>
    <h1>Deliveries</h1>
    <p>
      Vaccine and supply dispatch monitoring.
    </p>
  </div>

</div>

<div class="card">

  <app-data-state
    [loading]="loading()"
    [error]="errorMessage()"
    [isEmpty]="deliveries().length === 0"
    loadingMessage="Loading deliveries..."
    emptyMessage="No deliveries recorded yet."
    (retry)="load()">

  <table>

    <thead>

      <tr>
        <th>Delivery No.</th>
        <th>PRS No.</th>
        <th>Destination</th>
        <th>Date</th>
        <th>Prepared By</th>
        <th>Status</th>
        <th>Last Updated</th>
        <th></th>
      </tr>

    </thead>

    <tbody>

      <tr
        *ngFor="let delivery of deliveries()">

        <td>
          {{ delivery.deliveryNumber }}
          <app-copy-button [value]="delivery.deliveryNumber"></app-copy-button>
        </td>

        <td>
          {{ delivery.prsNumber }}
        </td>

        <td>
          {{ delivery.branchName }}
        </td>

        <td>
          {{ delivery.deliveryDate }}
        </td>

        <td>
          {{ delivery.preparedBy }}
        </td>

        <td>
          {{ delivery.status }}
        </td>

        <td>
          <app-last-updated [date]="delivery.updatedAt || delivery.createdAt"></app-last-updated>
        </td>

        <td>

          <button
            *ngIf="
              delivery.status === 'PREPARING' &&
              canDispatch
            "
            [disabled]="dispatchingId() === delivery.id"
            (click)="dispatch(delivery)">

            {{ dispatchingId() === delivery.id ? 'Dispatching...' : 'Dispatch' }}

          </button>

        </td>

      </tr>

    </tbody>

  </table>

  </app-data-state>

</div>
