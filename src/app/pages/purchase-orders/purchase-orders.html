<h1>Purchase Orders</h1>

<div class="layout">

  <div class="card">

    <h3>Create Purchase Order</h3>

    <input
      [(ngModel)]="form.supplierName"
      placeholder="Supplier">

    <input
      [(ngModel)]="form.reference"
      placeholder="Reference / Supplier DR">

    <input
      type="number"
      [(ngModel)]="form.amount"
      placeholder="Amount">

    <textarea
      [(ngModel)]="form.remarks"
      placeholder="Remarks">
    </textarea>

    <button
      [disabled]="saving()"
      (click)="save()">

      {{ saving() ? 'Creating...' : 'Create PO' }}

    </button>

  </div>

  <div class="card">

    <h3>Purchase Orders</h3>

    <app-data-state
      [loading]="loading()"
      [error]="errorMessage()"
      [isEmpty]="orders().length === 0"
      loadingMessage="Loading purchase orders..."
      emptyMessage="No purchase orders have been created yet."
      (retry)="load()">

    <table>

      <thead>
        <tr>
          <th>PO No.</th>
          <th>Supplier</th>
          <th>Reference</th>
          <th>Amount</th>
          <th>Status</th>
          <th>Last Updated</th>
        </tr>
      </thead>

      <tbody>

        <tr
          *ngFor="let po of orders()">

          <td>
            {{ po.poNumber }}
            <app-copy-button [value]="po.poNumber"></app-copy-button>
          </td>

          <td>
            {{ po.supplierName }}
          </td>

          <td>
            {{ po.reference }}
          </td>

          <td>
            ₱{{ po.amount | number:'1.2-2' }}
          </td>

          <td>{{ po.status }}</td>

          <td>
            <app-last-updated [date]="po.updatedAt || po.createdAt"></app-last-updated>
          </td>

        </tr>

      </tbody>

    </table>

    </app-data-state>

  </div>

</div>
