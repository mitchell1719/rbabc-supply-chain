<h1>Discrepancies</h1>

<p class="subtitle">
  Receiving reports requiring resolution.
</p>

<app-data-state
  [loading]="loading()"
  [error]="errorMessage()"
  [isEmpty]="records().length === 0"
  loadingMessage="Loading discrepancies..."
  emptyMessage="No open discrepancies. Great work!"
  (retry)="load()">

  <div
    class="card"
    *ngFor="let record of records()">

    <h3>
      {{ record.receivingNumber }}
      <app-copy-button [value]="record.receivingNumber"></app-copy-button>
    </h3>

    <p>
      Branch:
      <strong>
        {{ record.branchName }}
      </strong>
      •
      <app-last-updated [date]="record.updatedAt || record.createdAt"></app-last-updated>
    </p>

    <div class="issue">

      {{ record.discrepancyRemarks }}

    </div>

    <textarea
      [(ngModel)]="resolution[record.id!]"
      placeholder="Enter corrective action / resolution">
    </textarea>

    <button
      [disabled]="resolvingId() === record.id"
      (click)="resolve(record)">

      {{ resolvingId() === record.id ? 'Resolving...' : 'Resolve Discrepancy' }}

    </button>

  </div>

</app-data-state>
