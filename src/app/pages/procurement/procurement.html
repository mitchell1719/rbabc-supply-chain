<h1>Procurement</h1>

<p class="subtitle">
  Manage PRS items requiring supplier procurement.
</p>

<div class="card">

  <app-data-state
    [loading]="loading"
    [error]="errorMessage"
    [isEmpty]="records.length === 0"
    loadingMessage="Loading procurement records..."
    emptyMessage="No requests are currently in procurement."
    (retry)="load()">

  <table>

    <thead>
      <tr>
        <th>PR No.</th>
        <th>Branch</th>
        <th>HQ</th>
        <th>Total</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody>

      <tr
        *ngFor="let request of records">

        <td>
          {{ request.controlNumber }}
        </td>

        <td>
          {{ request.branchName }}
        </td>

        <td>
          {{ request.headquartersName }}
        </td>

        <td>
          ₱{{ request.totalAmount | number:'1.2-2' }}
        </td>

        <td>
          {{ request.status }}
        </td>

        <td>

          <button
            *ngIf="
              request.status ===
              'PRS_CREATED'
              ||
              request.status ===
              'WAREHOUSE_CHECK'
            "
            [disabled]="processingId === request.id"
            (click)="procure(request)">

            {{ processingId === request.id ? 'Processing...' : 'Send for Procurement' }}

          </button>

          <button
            *ngIf="
              request.status ===
              'FOR_PROCUREMENT'
            "
            [disabled]="processingId === request.id"
            (click)="complete(request)">

            {{ processingId === request.id ? 'Processing...' : 'Complete Procurement' }}

          </button>

        </td>

      </tr>

    </tbody>

  </table>

  </app-data-state>

</div>
