<div
  class="confirm-backdrop"
  *ngIf="confirmService.state().open"
  (click)="respond(false)">

  <div
    class="confirm-box"
    [class.danger]="confirmService.state().danger"
    role="alertdialog"
    aria-modal="true"
    [attr.aria-label]="confirmService.state().title"
    (click)="$event.stopPropagation()">

    <h3>{{ confirmService.state().title }}</h3>

    <p>{{ confirmService.state().message }}</p>

    <div class="confirm-actions">
      <button type="button" class="cancel" (click)="respond(false)">
        {{ confirmService.state().cancelLabel }}
      </button>

      <button
        type="button"
        class="confirm"
        [class.danger]="confirmService.state().danger"
        (click)="respond(true)">
        {{ confirmService.state().confirmLabel }}
      </button>
    </div>

  </div>

</div>
