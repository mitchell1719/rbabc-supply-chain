<a class="skip-link" href="#main-content">Skip to main content</a>

<app-scroll-progress></app-scroll-progress>

<div class="application">

  <app-sidebar
    [mobileOpen]="mobileMenuOpen"
    (collapseChange)="sidebarChanged($event)"
    (mobileOpenChange)="setMobileMenu($event)">
  </app-sidebar>


  <main
    class="main-content"
    [class.collapsed]="sidebarCollapsed">

    <app-header (menuToggle)="toggleMobileMenu()"></app-header>


    <div
      class="router-content"
      id="main-content"
      tabindex="-1">

      <router-outlet>
      </router-outlet>

    </div>

  </main>

</div>

<app-back-to-top></app-back-to-top>
<app-contact-fab></app-contact-fab>
<app-cookie-banner></app-cookie-banner>
<app-confirm-dialog></app-confirm-dialog>
<app-search-overlay></app-search-overlay>
