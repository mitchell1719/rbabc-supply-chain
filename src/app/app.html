<ng-container *ngIf="showShell; else bare">

  <div class="application">

    <app-sidebar
      (collapseChange)="sidebarChanged($event)">
    </app-sidebar>


    <main
      class="main-content"
      [class.collapsed]="sidebarCollapsed">

      <app-header></app-header>


      <div class="router-content">

        <router-outlet>
        </router-outlet>

      </div>

    </main>

  </div>

</ng-container>

<ng-template #bare>
  <router-outlet></router-outlet>
</ng-template>
