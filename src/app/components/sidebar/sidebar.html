<aside
  class="sidebar"
  [class.collapsed]="collapsed"
  [class.mobile-open]="mobileOpen">


  <div class="brand">

    <div class="logo">
      RB
    </div>

    <div class="brand-name">

      <strong>
        RB ABC
      </strong>

      <span>
        Supply Chain Office
      </span>

    </div>

  </div>


  <button
    class="collapse-btn"
    (click)="toggleSidebar()">

    {{ collapsed ? '›' : '‹' }}

  </button>


  <nav (click)="onNavClick($event)">

    <p class="menu-title">
      MAIN MENU
    </p>

    <a
      routerLink="/dashboard"
      routerLinkActive="active">

      <span>▦</span>
      <label>Dashboard</label>

    </a>


    <p class="menu-title">
      REQUESTS
    </p>


    <a
      routerLink="/purchase-requests"
      routerLinkActive="active">

      <span>📋</span>
      <label>Purchase Requests</label>

    </a>


    <a
      *ngIf="canReviewAsRns"
      routerLink="/rns-review"
      routerLinkActive="active">

      <span>🩺</span>
      <label>RNS Review</label>

    </a>


    <a
      *ngIf="canManageProcurement"
      routerLink="/hq-consolidation"
      routerLinkActive="active">

      <span>🏢</span>
      <label>HQ Consolidation</label>

    </a>


    <a
      *ngIf="canManageProcurement"
      routerLink="/prs"
      routerLinkActive="active">

      <span>📄</span>
      <label>PRS</label>

    </a>


    <p class="menu-title" *ngIf="canManageProcurement">
      PROCUREMENT
    </p>


    <a
      *ngIf="canManageProcurement"
      routerLink="/procurement"
      routerLinkActive="active">

      <span>🛒</span>
      <label>Procurement</label>

    </a>


    <a
      *ngIf="canManageProcurement"
      routerLink="/purchase-orders"
      routerLinkActive="active">

      <span>📑</span>
      <label>Purchase Orders</label>

    </a>


    <a
      *ngIf="canManageProcurement"
      routerLink="/suppliers"
      routerLinkActive="active">

      <span>🏭</span>
      <label>Suppliers</label>

    </a>


    <p class="menu-title">
      LOGISTICS
    </p>


    <a
      routerLink="/deliveries"
      routerLinkActive="active">

      <span>🚚</span>
      <label>Deliveries</label>

    </a>


    <a
      routerLink="/receiving"
      routerLinkActive="active">

      <span>📥</span>
      <label>Receiving Reports</label>

    </a>


    <a
      routerLink="/discrepancies"
      routerLinkActive="active">

      <span>⚠</span>
      <label>Discrepancies</label>

    </a>


    <p class="menu-title">
      INVENTORY
    </p>


    <a
      routerLink="/inventory"
      routerLinkActive="active">

      <span>📦</span>
      <label>Inventory</label>

    </a>


    <a
      routerLink="/vaccine-wastage"
      routerLinkActive="active">

      <span>💉</span>
      <label>Vaccine Wastage</label>

    </a>


    <p class="menu-title">
      FINANCE
    </p>


    <a
      routerLink="/soa"
      routerLinkActive="active">

      <span>💳</span>
      <label>SOA</label>

    </a>


    <p class="menu-title">
      MANAGEMENT
    </p>


    <a
      *ngIf="canManageReferenceData"
      routerLink="/branches"
      routerLinkActive="active">

      <span>🏥</span>
      <label>Branches</label>

    </a>


    <a
      *ngIf="canManageUsers"
      routerLink="/user-access"
      routerLinkActive="active">

      <span>🔐</span>
      <label>User Access</label>

    </a>


    <a
      *ngIf="canManageUsers"
      routerLink="/audit-log"
      routerLinkActive="active">

      <span>🧾</span>
      <label>Audit Log</label>

    </a>


    <a
      routerLink="/reports"
      routerLinkActive="active">

      <span>📊</span>
      <label>Reports</label>

    </a>


    <a
      routerLink="/settings"
      routerLinkActive="active">

      <span>⚙</span>
      <label>Settings</label>

    </a>


    <p class="menu-title">
      SUPPORT
    </p>


    <a
      routerLink="/help"
      routerLinkActive="active">

      <span>❓</span>
      <label>Help &amp; FAQ</label>

    </a>

  </nav>

</aside>

<div
  class="sidebar-overlay"
  *ngIf="mobileOpen"
  (click)="closeMobile()">
</div>
