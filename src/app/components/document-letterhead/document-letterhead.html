<div class="letterhead">

  <img
    src="/assets/rb-abc-logo.png"
    alt="RB-ABC logo"
    class="logo">

  <div class="brand-text">
    <div class="brand-name">
      <span class="rabies">Rabies Buster</span>
      <span class="animal">Animal Bite Center</span>
    </div>

    <p class="tagline">
      "Vaccinating people against Rabies since 2019"
    </p>
  </div>

</div>

<h2 class="doc-title" *ngIf="title">{{ title }}</h2>
<p class="doc-subtitle" *ngIf="subtitle">{{ subtitle }}</p>
